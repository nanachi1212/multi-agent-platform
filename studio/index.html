<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multi-Agent Studio</title>
<style>
  :root {
    --bg:#f4f1ec; --panel:#fffdf9; --panel2:#f8f5ef; --line:#e6e0d6; --text:#24211c; --muted:#857d70;
    --accent:#5b5bd6; --accent-soft:#ebebfb; --ok:#2f8f5b; --ok-soft:#e3f3ea; --bad:#c94a3f; --bad-soft:#fbe8e5;
    --work:#d98a1e; --work-soft:#fbf0dc; --wait:#8d8678; --wait-soft:#efebe4; --pause:#3f7fbf; --pause-soft:#e2eef9;
    --shadow:0 1px 2px rgba(40,30,10,.06), 0 4px 16px rgba(40,30,10,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#17181b; --panel:#1f2024; --panel2:#26272c; --line:#33353b; --text:#ecebe8; --muted:#9a978f;
      --accent:#8b8bf0; --accent-soft:#2b2b48; --ok:#5cc28a; --ok-soft:#1f3328; --bad:#ec7a6f; --bad-soft:#3b2220;
      --work:#f0a948; --work-soft:#3a2e1a; --wait:#a39d92; --wait-soft:#2c2c2f; --pause:#7fb3e8; --pause-soft:#1d2c3b; --shadow:none; }
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.55 "Segoe UI","Microsoft JhengHei UI","Microsoft JhengHei",sans-serif; }
  button, input, textarea, select { font:inherit; color:inherit; }

  .topbar { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:12px; padding:10px 24px; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:16px; }
  .logo { width:28px; height:28px; border-radius:8px; background:linear-gradient(135deg,#d97757,#5b5bd6 55%,#10a37f); }
  .proj-chip { padding:4px 12px; border-radius:999px; background:var(--panel2); border:1px solid var(--line); color:var(--muted); max-width:36vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .spacer { flex:1; }
  .pill { display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:999px; font-weight:600; font-size:13px; background:var(--wait-soft); color:var(--wait); white-space:nowrap; }
  .pill::before { content:""; width:8px; height:8px; border-radius:50%; background:currentColor; }
  .pill.on { background:var(--work-soft); color:var(--work); } .pill.on::before { animation:pulse 1.2s infinite; }
  .pill.ok { background:var(--ok-soft); color:var(--ok); } .pill.pz { background:var(--pause-soft); color:var(--pause); }
  @keyframes pulse { 50% { opacity:.25; } }

  .btn { padding:8px 16px; border-radius:10px; border:1px solid var(--line); background:var(--panel); cursor:pointer; transition:border-color .15s; white-space:nowrap; }
  .btn:hover:not(:disabled) { border-color:var(--accent); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; padding:9px 22px; }
  .btn.danger { background:var(--bad); border-color:var(--bad); color:#fff; font-weight:600; }
  .btn.pz { background:var(--pause); border-color:var(--pause); color:#fff; font-weight:600; }
  .btn.ghost { background:transparent; }
  .btn.small { padding:4px 10px; font-size:12px; border-radius:8px; }
  .btn:disabled { opacity:.45; cursor:not-allowed; }

  .kpis { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; }
  @media (max-width:900px) { .kpis { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  .kpi { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 16px; box-shadow:var(--shadow); }
  .kpi .v { font-size:26px; font-weight:700; line-height:1.2; }
  .kpi .l { color:var(--muted); font-size:12px; font-weight:600; }

  .layout { display:grid; grid-template-columns:280px 1fr; gap:20px; padding:20px 24px; max-width:1500px; margin:0 auto; }
  @media (max-width:980px) { .layout { grid-template-columns:1fr; padding:16px; } }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; box-shadow:var(--shadow); }
  h3 { margin:0 0 12px; font-size:13px; font-weight:700; color:var(--muted); letter-spacing:.4px; display:flex; align-items:center; gap:8px; }
  h2.zone { margin:4px 0 -8px; font-size:15px; font-weight:700; }
  .sub { color:var(--muted); font-size:12px; margin:14px 0 6px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  input[type=text], textarea, select { width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:10px; background:var(--panel2); outline:none; }
  input[type=text]:focus, textarea:focus, select:focus { border-color:var(--accent); }
  .sidebar { display:flex; flex-direction:column; gap:16px; }
  .sidebar .row { margin-top:8px; }
  .empty { color:var(--muted); font-size:13px; padding:6px 0; }

  .recent { display:flex; flex-direction:column; gap:6px; }
  .chip { display:flex; align-items:center; gap:8px; padding:7px 10px; border-radius:10px; border:1px solid var(--line); background:var(--panel2); cursor:pointer; }
  .chip:hover { border-color:var(--accent); } .chip.on { border-color:var(--accent); background:var(--accent-soft); }
  .chip .nm { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
  .chip .x { color:var(--muted); padding:0 4px; } .chip .x:hover { color:var(--bad); }
  .history { display:flex; flex-direction:column; gap:6px; max-height:460px; overflow:auto; }
  .hitem { padding:8px 10px; border-radius:10px; border:1px solid var(--line); background:var(--panel2); cursor:pointer; text-align:left; width:100%; }
  .hitem:hover { border-color:var(--accent); }
  .hitem .req { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hitem .meta { color:var(--muted); font-size:12px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .tag { font-size:11px; font-weight:700; padding:1px 8px; border-radius:999px; background:var(--wait-soft); color:var(--wait); letter-spacing:.3px; white-space:nowrap; }
  .tag.lead { background:var(--c); color:#fff; } .tag.ok { background:var(--ok-soft); color:var(--ok); } .tag.bad { background:var(--bad-soft); color:var(--bad); }
  .tag.pz { background:var(--pause-soft); color:var(--pause); }

  .stage { display:flex; flex-direction:column; gap:20px; min-width:0; }
  .office { display:flex; flex-direction:column; gap:12px; border-top:4px solid var(--c); padding:18px 20px; }
  .boss { display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:15px; }
  .boss .crown { font-weight:700; color:var(--muted); }
  .boss .meta { color:var(--muted); }
  .boss .seat-status { min-height:0; font-size:13px; }
  .boss select { width:auto; padding:5px 8px; font-size:13px; border-radius:8px; }
  .team-line { color:var(--muted); font-size:13px; }
  details.rules summary { cursor:pointer; color:var(--accent); font-size:13px; font-weight:600; width:max-content; }
  details.rules .rules-b { margin-top:8px; background:var(--panel2); border-radius:10px; padding:10px 12px; font-size:13px; max-height:320px; overflow:auto; white-space:pre-wrap; word-break:break-word; }
  details.rules .rules-b b { display:block; color:var(--muted); font-size:12px; margin:6px 0 2px; }
  .ask { margin:4px 0 0; font-size:18px; font-weight:700; }
  .office textarea { min-height:110px; resize:vertical; border-radius:12px; font-size:15px; }
  .hint { color:var(--muted); font-size:12px; }
  .kpi-drop { position:relative; cursor:pointer; }
  .kpi-drop > summary { list-style:none; } .kpi-drop > summary::-webkit-details-marker { display:none; }
  .kpi-drop[open] { border-color:var(--accent); }
  .drop { position:absolute; left:0; top:calc(100% + 6px); z-index:6; width:min(560px,80vw); max-height:420px; overflow:auto; background:var(--panel); border:1px solid var(--line); border-radius:12px; box-shadow:0 12px 32px rgba(0,0,0,.18); padding:8px; cursor:default; }
  .drow { padding:8px 10px; border-radius:8px; border-bottom:1px solid var(--line); }
  .drow:last-child { border-bottom:none; }
  .drow .t { font-weight:600; } .drow .who { margin-left:6px; }
  .drow .res { color:var(--muted); font-size:12.5px; white-space:pre-wrap; word-break:break-word; margin-top:4px; }
  .steps { display:flex; flex-direction:column; gap:0; }
  .now-line { font-size:15px; font-weight:700; margin-bottom:10px; }
  .step { display:grid; grid-template-columns:28px 1fr; gap:10px; padding:8px 0; border-bottom:1px dashed var(--line); }
  .step:last-child { border-bottom:none; }
  .step .ic { font-size:16px; text-align:center; }
  .step .st { font-weight:600; } .step .sd { color:var(--muted); font-size:12.5px; white-space:pre-wrap; word-break:break-word; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .step.cur .st { color:var(--work); }
  .wf-head { display:flex; align-items:center; gap:14px; margin-bottom:12px; }
  .wf-head .big { font-size:30px; line-height:1; }
  .wf-head .st-line { font-size:17px; font-weight:700; }
  .wf { display:grid; grid-template-columns:88px 1fr; gap:8px 14px; margin:0 0 6px; font-size:14px; }
  .wf dt { color:var(--muted); font-weight:700; font-size:13px; padding-top:1px; }
  .wf dd { margin:0; white-space:pre-wrap; word-break:break-word; }
  .wf-panel { border-top:4px solid var(--c, var(--line)); }
  .wf-panel.need { border-top-color:var(--bad); background:linear-gradient(var(--bad-soft), var(--panel) 120px); }
  .askbox { margin-top:8px; display:flex; flex-direction:column; gap:8px; background:var(--panel2); border:1px solid var(--bad); border-radius:12px; padding:12px; }
  .askbox .q { font-weight:700; white-space:pre-wrap; }
  .askbox textarea { min-height:60px; }
  .att { font-size:13px; font-weight:700; padding:6px 10px; border-radius:10px; background:var(--panel2); }
  .att.bad { background:var(--bad-soft); color:var(--bad); } .att.ok { background:var(--ok-soft); color:var(--ok); }
  .att.on { background:var(--work-soft); color:var(--work); } .att.pz { background:var(--pause-soft); color:var(--pause); }
  details.tech { margin-top:4px; font-size:12px; } details.tech summary { cursor:pointer; color:var(--muted); }
  details.tech pre { white-space:pre-wrap; word-break:break-word; max-height:220px; overflow:auto; background:var(--panel2); border-radius:8px; padding:8px; margin:4px 0 0; font:11.5px/1.5 Consolas,monospace; }
  .sys-wrap { align-self:center; max-width:90%; display:flex; flex-direction:column; align-items:center; }
  .err { color:var(--bad); font-weight:600; }
  .now { background:var(--panel2); border-radius:10px; padding:8px 12px; font-size:13px; }
  .now b { color:var(--muted); font-size:12px; }

  .seats { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:14px; }
  .seat { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:10px; border-top:4px solid var(--c); min-width:0; }
  .seat.off { opacity:.62; }
  .seat-top { display:flex; align-items:center; gap:12px; }
  .avatar { width:44px; height:44px; border-radius:12px; display:grid; place-items:center; color:#fff; font-weight:700; background:var(--c); flex:none; }
  .office .avatar { width:56px; height:56px; font-size:18px; border-radius:14px; }
  .seat-name { font-weight:700; font-size:15px; }
  .tags { display:flex; gap:6px; flex-wrap:wrap; margin-top:2px; }
  .facts { display:grid; grid-template-columns:auto 1fr; gap:3px 10px; font-size:13px; }
  .facts dt { color:var(--muted); } .facts dd { margin:0; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .seat-status { display:flex; align-items:center; gap:8px; font-weight:600; min-height:22px; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--wait); flex:none; }
  .dot.work { background:var(--work); animation:pulse 1.2s infinite; } .dot.bad { background:var(--bad); } .dot.pz { background:var(--pause); }
  .seat-last { color:var(--muted); font-size:13px; background:var(--panel2); border-radius:10px; padding:8px 10px; min-height:40px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; white-space:pre-wrap; word-break:break-word; }
  details.cfg-box summary { cursor:pointer; color:var(--muted); font-size:12px; font-weight:600; }
  .cfg { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
  .cfg label { display:flex; flex-direction:column; gap:3px; font-size:11px; font-weight:700; color:var(--muted); }
  .cfg select { padding:5px 8px; font-size:13px; font-weight:400; border-radius:8px; }
  .cfg-note { font-size:11.5px; color:var(--muted); }
  .seat .btn { align-self:flex-start; }
  .limits { display:flex; flex-direction:column; gap:7px; }
  .lim-h { display:flex; justify-content:space-between; gap:8px; font-size:12px; }
  .lim-h b { font-weight:700; } .lim-h span { color:var(--muted); }
  .bar { height:8px; border-radius:999px; background:var(--panel2); border:1px solid var(--line); overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--ok); border-radius:999px; }
  .bar.warn i { background:var(--work); } .bar.hot i { background:var(--bad); }
  .tbar { height:3px; margin-top:3px; border-radius:999px; background:var(--panel2); overflow:hidden; }
  .tbar i { display:block; height:100%; background:var(--muted); opacity:.45; }
  .lim-f { display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--muted); }

  .board { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:12px; }
  @media (max-width:1100px) { .board { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  .lane { background:var(--panel2); border-radius:12px; padding:10px; min-height:110px; }
  .lane-h { display:flex; align-items:center; gap:6px; font-size:12px; font-weight:700; color:var(--muted); margin-bottom:8px; }
  .lane-h .n { margin-left:auto; background:var(--panel); border-radius:999px; padding:0 8px; }
  .card { background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--c); border-radius:10px; padding:10px; margin-bottom:8px; }
  .card .t { font-weight:600; margin-bottom:6px; word-break:break-word; }
  .who { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; }
  .who i { width:8px; height:8px; border-radius:50%; background:var(--c); display:inline-block; }
  .card .res { color:var(--muted); font-size:12px; margin-top:6px; white-space:pre-wrap; word-break:break-word; max-height:110px; overflow:auto; }
  .card .re { display:flex; gap:6px; margin-top:8px; }
  .card select { padding:4px 6px; font-size:12px; border-radius:8px; }

  .cols { display:grid; grid-template-columns:minmax(0,2fr) minmax(0,1fr); gap:20px; }
  @media (max-width:1100px) { .cols { grid-template-columns:1fr; } }
  .chat { display:flex; flex-direction:column; gap:10px; max-height:560px; overflow:auto; padding-right:4px; }
  .msg { display:flex; gap:10px; align-items:flex-start; max-width:88%; }
  .msg .av { width:30px; height:30px; border-radius:9px; background:var(--c); color:#fff; font-size:11px; font-weight:700; display:grid; place-items:center; flex:none; }
  .bubble { background:var(--panel2); border:1px solid var(--line); border-radius:4px 14px 14px 14px; padding:8px 12px; white-space:pre-wrap; word-break:break-word; }
  .bubble .hd { font-size:12px; color:var(--muted); margin-bottom:2px; } .bubble .hd b { color:var(--text); }
  .msg.me { align-self:flex-end; }
  .msg.me .bubble { background:var(--accent); color:#fff; border-color:var(--accent); border-radius:14px 4px 14px 14px; }
  .msg.me .bubble .hd, .msg.me .bubble .hd b { color:rgba(255,255,255,.85); }
  .sys { align-self:center; color:var(--muted); font-size:12px; background:var(--panel2); border-radius:999px; padding:3px 12px; text-align:center; max-width:90%; }
  #progress { white-space:pre-wrap; margin:0; max-height:520px; overflow:auto; background:var(--panel2); border-radius:10px; padding:10px; font:12.5px/1.6 Consolas,"Microsoft JhengHei",monospace; }

  .pill.bad { background:var(--bad-soft); color:var(--bad); }
  .dot.ok { background:var(--ok); }
  .tabs { display:flex; gap:4px; flex-wrap:wrap; align-items:center; min-width:0; }
  .tab { display:inline-flex; align-items:center; gap:7px; padding:6px 14px; border-radius:10px; border:1px solid transparent; color:var(--muted); text-decoration:none; font-weight:600; background:none; cursor:pointer; max-width:220px; }
  .tab:hover { border-color:var(--line); color:var(--text); }
  .tab.on { background:var(--accent-soft); color:var(--accent); border-color:var(--accent); }
  .tab .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tab .n { background:var(--work); color:#fff; border-radius:999px; padding:0 7px; font-size:11px; }
  .tab.add { font-size:16px; padding:4px 12px; }
  .pv-head { display:flex; align-items:center; gap:12px; flex-wrap:wrap; border-top:4px solid var(--c); }
  .pv-head .nm { font-size:18px; font-weight:700; }
  .pv-head .sub { margin:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:40vw; }
  .projects { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; }
  .pcard { display:flex; flex-direction:column; gap:8px; background:var(--panel); border:1px solid var(--line); border-top:4px solid var(--c); border-radius:16px; padding:14px 16px; box-shadow:var(--shadow); color:inherit; text-decoration:none; min-width:0; }
  .pcard:hover { border-color:var(--accent); border-top-color:var(--c); }
  .pc-top { display:flex; align-items:center; gap:8px; } .pc-top .nm { font-weight:700; font-size:16px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pc-req { font-size:13px; background:var(--panel2); border-radius:10px; padding:7px 10px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .sbar { display:flex; height:8px; border-radius:999px; background:var(--panel2); border:1px solid var(--line); overflow:hidden; }
  .sbar i { display:block; height:100%; }
  .matrix { width:100%; border-collapse:collapse; font-size:13px; }
  .matrix th, .matrix td { border-bottom:1px solid var(--line); padding:8px 10px; text-align:left; vertical-align:top; }
  .matrix th { color:var(--muted); font-size:12px; font-weight:700; }
  .matrix td.idle { color:var(--muted); }
  .mx-wrap { overflow-x:auto; }

  dialog { width:min(1100px,94vw); max-height:88vh; border:1px solid var(--line); border-radius:16px; padding:0; background:var(--bg); color:var(--text); box-shadow:0 20px 60px rgba(0,0,0,.25); }
  dialog::backdrop { background:rgba(20,18,14,.45); }
  .dlg-h { position:sticky; top:0; display:flex; align-items:center; gap:12px; padding:14px 18px; background:var(--panel); border-bottom:1px solid var(--line); }
  .dlg-b { padding:18px; display:flex; flex-direction:column; gap:16px; }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo"></span>Multi-Agent Studio</div>
  <nav class="tabs" id="tabs"></nav>
  <span class="spacer"></span>
  <button class="btn small" id="notifyBtn" title="每個專案完成或需要你處理時發 Windows 通知（點通知直接打開該專案分頁）；開著的網頁另外播提示音">🔔 通知：開</button>
  <select id="fontSize" title="字體大小（整個畫面，記在這個瀏覽器）" style="width:auto;padding:4px 8px;font-size:13px;border-radius:8px">
    <option value="1">字體：標準</option><option value="1.15">字體：大</option><option value="1.3">字體：特大</option><option value="1.5">字體：超大</option>
  </select>
  <span class="pill" id="paseoPill">Paseo</span>
</header>

<div class="layout">
  <aside class="sidebar">
    <section class="panel">
      <h3>開啟專案</h3>
      <input type="text" id="project" placeholder="貼上資料夾路徑，例如 D:\my-project">
      <div class="row"><button class="btn" id="browse">瀏覽…</button><button class="btn" id="setProject">開啟</button></div>
      <div class="sub">常用專案（點一下開啟成分頁；每個專案可同時工作）</div>
      <div class="recent" id="recent"></div>
    </section>
    <section class="panel">
      <h3 id="histHead">歷史紀錄</h3>
      <div class="history" id="history"></div>
    </section>
  </aside>

  <main class="stage" id="overview">
    <section class="kpis" id="ovKpis"></section>
    <h2 class="zone">專案</h2>
    <section class="projects" id="projects"></section>
    <h2 class="zone">誰在做什麼</h2>
    <section class="panel mx-wrap" id="matrix"></section>
    <h2 class="zone">AI 員工（全部專案）</h2>
    <section class="seats" id="ovSeats"></section>
  </main>

  <main class="stage" id="projectView" hidden>
    <section class="panel pv-head" id="pvHead">
      <div style="min-width:0"><div class="row" style="gap:6px"><span class="nm" id="pvName"></span><button class="btn small ghost" id="renameWs" title="改顯示名稱（分頁、總覽、Windows 通知都用這個名稱）">✎ 改名</button></div><div class="sub" id="pvPath"></div></div>
      <span class="spacer"></span>
      <span class="pill" id="runPill">待命</span>
      <button class="btn small" id="paseoOpen">用 Paseo 開啟</button>
      <button class="btn pz" id="pauseResume" title="暫停：成員馬上停下，工作卡和進度都保留，Studio 不會自己恢復；要你按「繼續」才會接著做。">暫停</button>
      <button class="btn danger" id="stop" title="停止：這件工作到此為止，未完成的卡標成失敗，不能再「繼續」；要接著做請用「▶ 接著處理」開新的一輪。">Stop</button>
      <button class="btn small ghost" id="closeWs" title="關閉這個分頁（暫停中的工作仍在歷史紀錄）">關閉分頁</button>
    </section>
    <section class="panel wf-panel" id="nowPanel"></section>
    <section class="kpis" id="kpis"></section>

    <h2 class="zone">交辦工作</h2>
    <section class="panel office" id="office"></section>

    <h2 class="zone">AI 員工</h2>
    <section class="seats" id="seats"></section>

    <h2 class="zone">工作卡</h2>
    <section class="panel"><div id="board"></div></section>

    <div class="cols">
      <section class="panel">
        <h3>完整對話紀錄（細節）</h3>
        <div class="chat" id="chat"></div>
      </section>
      <section class="panel" id="progressBox" hidden>
        <h3 id="progressTitle">專案進度</h3>
        <pre id="progress"></pre>
      </section>
    </div>
  </main>
</div>

<dialog id="histDlg">
  <div class="dlg-h"><b id="histTitle">歷史紀錄</b><span class="spacer"></span><button class="btn pz small" id="histResume" hidden>繼續這個工作</button><button class="btn small" id="histClose">關閉</button></div>
  <div class="dlg-b">
    <div class="panel" id="histMeta"></div>
    <div class="panel"><h3>工作看板</h3><div id="histBoard"></div></div>
    <div class="panel"><h3>團隊對話</h3><div class="chat" id="histChat" style="max-height:none"></div></div>
  </div>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const LOOK = { claude: { c:'#d97757', ab:'CC' }, codex: { c:'#10a37f', ab:'CX' }, antigravity: { c:'#4285f4', ab:'AG' } };
const look = (id) => LOOK[id] || { c:'#8d8678', ab:String(id).slice(0, 2).toUpperCase() };
// Board lanes; a lane can hold several card states.
const LANES = [[['WAITING','PAUSED','INTERRUPTED'],'待做'], [['WORKING'],'工作中'], [['WAITING_EXTERNAL','WAITING_AGENT','NEEDS_USER'],'在等'], [['DONE'],'已完成'], [['FAILED'],'失敗 / 停止']];
const PARKED = ['WAITING_EXTERNAL', 'WAITING_AGENT', 'NEEDS_USER'];
const STATUS = { done:'完成', failed:'有失敗', stopped:'已停止', paused:'暫停中', running:'進行中', interrupted:'中斷（可繼續）' };
let S = null, last = '', histKey = '', histOpenId = null, histOpenProject = '', shownView = null;
const drafts = {}; // unsent request text per project

// The page shows the overview (#) or one project (#p=<folder>).
const curPath = () => { const m = location.hash.match(/^#p=(.+)$/); return m ? decodeURIComponent(m[1]) : ''; };
const W = () => S.workspaces.find((w) => w.project === curPath()) || null;
const go = (p) => { location.hash = p ? 'p=' + encodeURIComponent(p) : ''; };
const sameP = (a, b) => String(a).toLowerCase() === String(b).toLowerCase();
const anyActive = () => S.workspaces.some((w) => w.run?.active);
window.addEventListener('hashchange', () => S && render());

// [dot class, label, pill class] for a project tab / card.
function wsStatus(w) {
  const r = w.run;
  if (!r) return ['', '待命', ''];
  if (r.active) return ['work', { planning:'規劃中', summarizing:'工頭確認中' }[r.phase] || (w.tasks.some((t) => t.status === 'WORKING') ? '工作中' : '等待中'), 'on'];
  if (r.paused) return ['pz', '已暫停', 'pz'];
  if (r.stopped) return ['', '已停止', ''];
  return w.tasks.length && w.tasks.every((t) => t.status === 'DONE') ? ['ok', '已完成', 'ok'] : ['bad', '有失敗', 'bad'];
}

async function post(url, body) {
  $('err') && ($('err').textContent = '');
  const r = await fetch(url, { method:'POST', headers:{ 'content-type':'application/json' }, body:JSON.stringify(body || {}) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { if ($('err')) $('err').textContent = j.error || ('錯誤 ' + r.status); else alert(j.error); throw new Error(j.error); }
  refresh();
  return j;
}

const name = (id) => S.agents.find((a) => a.id === id)?.name || id;
const base = (p) => String(p).split(/[\\/]/).filter(Boolean).pop() || p;
const fmt = (iso) => new Date(iso).toLocaleString('zh-TW', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit', hour12:false });
const when = (iso) => new Date(iso).toDateString() === new Date().toDateString() ? new Date(iso).toLocaleTimeString('zh-TW', { hour:'2-digit', minute:'2-digit', hour12:false }) : fmt(iso);

// w = the project whose settings are shown; no w (overview) = settings live on each project page.
const STRATEGY = [['save', '💰 省額度：普通卡用便宜模型，困難卡自動升級強模型'], ['balanced', '⚖️ 均衡：同樣分兩檔，思考強度高一級'], ['quality', '🚀 品質優先：普通卡就用強模型，困難卡用最強'], ['custom', '🛠️ 自訂：用員工卡上自己設的模型']];
function modelName(a, value) {
  if (!a.models.length) return a.status === 'checking' ? '讀取中…' : '預設';
  if (value) return a.models.find((m) => m.value === value)?.name || value;
  const def = a.models.find((m) => m.value === 'default');
  return def ? `預設（${def.description.split(' · ')[0]}）` : '預設';
}
function modelLabel(a, w) {
  if (!w) return '依專案設定';
  return modelName(a, w.tiers?.[a.id]?.normal.model);
}
const effortLabel = (a, w) => !w ? '依專案設定' : w.tiers?.[a.id]?.normal.effort || (a.efforts.length ? '預設' : '—');

function cfgHtml(a, w) {
  if (!w) return '<div class="cfg-note">模型／思考強度在各專案頁分開設定。</div>';
  if (!a.models.length && !a.efforts.length) return `<div class="cfg-note">${a.status === 'checking' ? '讀取模型清單中…' : '這位 AI 員工使用預設模型（不支援切換）'}</div>`;
  if (w.strategy !== 'custom') {
    const t = w.tiers?.[a.id] || {}, tier = (x) => `${esc(modelName(a, x?.model))}${x?.effort ? ' · ' + esc(x.effort) : ''}`;
    return `<div class="cfg-note">依模型策略「${esc((STRATEGY.find(([k]) => k === w.strategy) || [, ''])[1].split('：')[0])}」：普通卡 ${tier(t.normal)}；困難卡 ${tier(t.hard)}。想自己指定模型，把模型策略改成「🛠️ 自訂」。</div>`;
  }
  const cfg = w.agentCfg[a.id] || {}, busy = w.run?.active;
  const models = (k) => `<select data-cfg="${a.id}" data-k="${k}"><option value="">${k === 'hardModel' ? '同平常' : '預設'}</option>${a.models.map((m) => `<option value="${esc(m.value)}" title="${esc(m.description)}" ${m.value === cfg[k] ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}</select>`;
  const efforts = (k) => `<select data-cfg="${a.id}" data-k="${k}" ${a.efforts.length ? '' : 'disabled'}><option value="">${k === 'hardEffort' ? '同平常' : '預設'}</option>${a.efforts.map((x) => `<option value="${esc(x)}" ${x === cfg[k] ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select>`;
  return `<details class="cfg-box"><summary>這個專案的模型／思考強度${busy ? '（下一次開始工作生效）' : ''}</summary><div class="cfg">
    <label>平常的模型${models('model')}</label><label>平常的思考強度${efforts('effort')}</label>
    <label>困難卡的模型${models('hardModel')}</label><label>困難卡的思考強度${efforts('hardEffort')}</label>
  </div><div class="cfg-note">工頭只用「平常」；工頭標成「困難」的工作卡才用困難那一組。</div></details>`;
}

// 5-hour / weekly plan limits: usage bar + thin bar for how far the window is toward its reset.
function limitsHtml(a) {
  const L = S.limits[a.id];
  if (!L) {
    const why = a.id === 'antigravity' ? 'Antigravity 不提供額度資訊' : a.id === 'codex' ? '額度：Studio 的 Codex 工作過一次後顯示' : '額度：讀取中…';
    return `<div class="lim-f">${why}</div>`;
  }
  const now = Date.now() / 1000;
  const rows = L.windows.map((w) => {
    const label = w.windowMin >= 10080 ? '每週額度' : w.windowMin === 300 ? '5 小時額度' : `${Math.round(w.windowMin / 60)} 小時額度`;
    const reset = w.resetsAt <= now;
    const pct = reset ? 0 : Math.round(w.used * 100);
    const elapsed = reset ? 100 : Math.min(100, Math.max(0, 100 - ((w.resetsAt - now) / (w.windowMin * 60)) * 100));
    const at = new Date(w.resetsAt * 1000);
    const resetTxt = reset ? '已重置，等待更新' : `${at.toDateString() === new Date().toDateString() ? '今天 ' : (at.getMonth() + 1) + '/' + at.getDate() + ' '}${at.toLocaleTimeString('zh-TW', { hour:'2-digit', minute:'2-digit', hour12:false })} 重置`;
    return `<div><div class="lim-h"><b>${label}：已用 ${pct}%</b><span>${resetTxt}</span></div>
      <div class="bar ${pct >= 95 ? 'hot' : pct >= 80 ? 'warn' : ''}"><i style="width:${pct}%"></i></div>
      <div class="tbar" title="這個額度週期已經過了 ${Math.round(elapsed)}%"><i style="width:${elapsed}%"></i></div></div>`;
  }).join('');
  return `<div class="limits">${rows}<div class="lim-f">${new Date(L.updatedAt).toLocaleTimeString('zh-TW', { hour:'2-digit', minute:'2-digit', hour12:false })} 更新${a.id === 'claude' ? ' · <a href="#" data-limits-refresh>更新</a>' : ''}</div></div>`;
}

// What one agent does in one project: { kind: work|lead|wait|pz|'', text }.
function duty(a, w) {
  const r = w.run, t = (st) => w.tasks.filter((x) => x.status === st && x.agent === a.id);
  if (t('WORKING').length) return { kind:'work', text:t('WORKING')[0].title };
  if (r?.active && t('NEEDS_USER').length) return { kind:'bad', text:'需要 Nana：' + t('NEEDS_USER')[0].title };
  if (r?.active && t('WAITING_EXTERNAL').length) return { kind:'wait', text:'等待外部結果：' + t('WAITING_EXTERNAL')[0].title };
  if (r?.active && t('WAITING_AGENT').length) return { kind:'wait', text:'等待其他 AI：' + t('WAITING_AGENT')[0].title };
  if (w.leader === a.id && r?.active) return { kind:'work', text:{ planning:'工頭：規劃與派工中', summarizing:'工頭：整理總結中' }[r.phase] || '工頭：監督進度中' };
  if (r?.paused && (t('PAUSED').length || w.leader === a.id)) return { kind:'pz', text:'已暫停' + (t('PAUSED')[0] ? '：' + t('PAUSED')[0].title : '') };
  if (r?.active && t('WAITING').length) return { kind:'wait', text:`排隊中 ${t('WAITING').length} 張` };
  return { kind:'', text:w.leader === a.id ? '工頭' : w.workers.includes(a.id) ? '' : '不參與' };
}

// w = one project's seat view; no w = overview across all open projects.
function statusHtml(a, w) {
  if (a.status === 'checking') return '<span class="dot"></span>檢查中…';
  if (a.status === 'unavailable') return '<span class="dot bad"></span>無法使用';
  if (w) {
    const d = duty(a, w);
    if (d.kind === 'bad' || d.kind === 'wait') return `<span class="dot ${d.kind === 'bad' ? 'bad' : 'pz'}"></span>${esc(d.text)}`;
    if (d.kind === 'work' || d.kind === 'pz') return `<span class="dot ${d.kind}"></span>${d.kind === 'work' && !d.text.startsWith('工頭') ? '工作中：' : ''}${esc(d.text)}`;
    return '<span class="dot"></span>待命';
  }
  const busy = S.workspaces.filter((x) => duty(a, x).kind === 'work').length;
  return busy ? `<span class="dot work"></span>忙碌中：${busy} 個專案` : '<span class="dot"></span>待命';
}

function seatHtml(a, w) {
  const l = look(a.id), lead = w && a.id === w.leader, out = w && !lead && !w.workers.includes(a.id), off = a.status !== 'available' || out;
  const leads = S.workspaces.filter((x) => x.leader === a.id);
  const done = S.lastDone[a.id];
  let lastTxt;
  if (a.status === 'unavailable') lastTxt = a.note;
  else if (w) lastTxt = [...w.activity].reverse().find((m) => m.who === a.id)?.text || (lead ? '把需求交給我，我會拆成工作卡分給大家。' : '等待工頭派工。');
  else lastTxt = S.workspaces.map((x) => [x, duty(a, x)]).filter(([, d]) => d.kind).map(([x, d]) => `${x.name}：${d.text}`).join('\n') || '目前沒有工作。';
  const busy = w && (w.run?.active || w.run?.paused);
  const roleTag = w ? (lead ? '<span class="tag lead">工頭</span>' : '<span class="tag">成員</span>')
    : leads.length ? `<span class="tag lead" title="${esc(leads.map((x) => x.name).join('、'))}">工頭 × ${leads.length}</span>` : '<span class="tag">成員</span>';
  return `<div class="seat ${off ? 'off' : ''}" style="--c:${l.c}">
    <div class="seat-top"><div class="avatar">${l.ab}</div><div>
      <div class="seat-name">${esc(a.name)}</div>
      <div class="tags">${roleTag}${out ? '<span class="tag">這個專案不參與</span>' : ''}${a.status === 'available' ? '<span class="tag ok">可用</span>' : a.status === 'unavailable' ? '<span class="tag bad">不可用</span>' : ''}</div>
    </div></div>
    <div class="seat-status">${statusHtml(a, w)}</div>
    <dl class="facts">
      <dt>模型</dt><dd title="${esc(modelLabel(a, w))}">${esc(modelLabel(a, w))}</dd>
      <dt>思考強度</dt><dd>${esc(effortLabel(a, w))}</dd>
      ${w && a.models.length && w.tiers?.[a.id]?.hard.model && w.tiers[a.id].hard.model !== w.tiers[a.id].normal.model ? `<dt>困難卡</dt><dd>${esc(modelName(a, w.tiers[a.id].hard.model))}${w.tiers[a.id].hard.effort ? ' · ' + esc(w.tiers[a.id].hard.effort) : ''}</dd>` : ''}
      <dt>最近完成</dt><dd title="${esc(done?.title || '')}">${done ? `${esc(done.title)} · ${when(done.at)}` : '—'}</dd>
    </dl>
    <div class="seat-last">${esc(lastTxt)}</div>
    ${limitsHtml(a)}
    ${cfgHtml(a, w)}
    ${a.status === 'unavailable' ? '<button class="btn small" data-recheck title="重新連線並檢查所有 AI 員工">重新連線／重新檢查</button>' : ''}
    ${a.id === 'codex' && a.status === 'unavailable' ? `<div class="cfg-note">Studio 的 Codex 使用獨立資料夾，不會出現在你平常的 Codex 紀錄。登入一次後按「重新檢查」。</div><button class="btn small" data-codex-login>登入 Codex（Studio 專用）</button>` : ''}
    ${!w || lead ? '' : `<div class="row"><button class="btn small" data-leader="${a.id}" ${a.status !== 'available' ? 'disabled' : ''}>${busy ? '接手當工頭' : '設為工頭'}</button>
      <button class="btn small ghost" data-worker="${a.id}" data-on="${out ? 1 : 0}" title="只影響這個專案；下一次派工生效">${out ? '讓它參與這個專案' : '這個專案不用它'}</button></div>`}
  </div>`;
}

function boardHtml(tasks, agents, editable) {
  if (!tasks.length) return '<div class="empty">還沒有工作卡。在上面說你要什麼、按「交給團隊」，工頭會拆成工作卡派給成員。</div>';
  const avail = agents.filter((a) => a.status === 'available');
  return `<div class="board">${LANES.map(([st, label]) => {
    const list = tasks.filter((t) => st.includes(t.status));
    return `<div class="lane"><div class="lane-h">${label}<span class="n">${list.length}</span></div>${list.map((t) => `
      <div class="card" style="--c:${look(t.agent).c}">
        <div class="t">${esc(t.title)} ${t.writes === false ? '<span class="tag" title="只讀程式、審查或調查，不會修改檔案">唯讀</span> ' : ''}${t.escalated ? '<span class="tag">已升級強模型</span>' : t.hard ? '<span class="tag">困難</span>' : ''}${t.status === 'PAUSED' || t.status === 'INTERRUPTED' || PARKED.includes(t.status) ? `<span class="tag ${t.status === 'NEEDS_USER' ? 'bad' : 'pz'}">${STEP_WORD[t.status]}</span>` : ''}</div>
        <span class="who"><i></i>${esc(agents.find((a) => a.id === t.agent)?.name || t.agent)}</span>
        ${t.result && t.status !== 'PAUSED' ? `<div class="res">${esc(t.result)}</div>` : ''}
        ${PARKED.includes(t.status) ? `<div class="res"><b>${esc(waitLine(t))}</b></div>` : ''}
        ${t.detail ? `<details class="tech"><summary>查看技術細節</summary><pre>${esc(t.detail)}</pre></details>` : ''}
        ${editable && st !== 'WORKING' && st !== 'DONE' ? `<div class="re"><select data-task="${t.id}">${avail.map((a) => `<option value="${a.id}" ${a.id === t.agent ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select><button class="btn small" data-reassign="${t.id}">改派</button></div>` : ''}
      </div>`).join('')}</div>`;
  }).join('')}</div>`;
}

function chatHtml(activity) {
  if (!activity.length) return '<div class="empty">尚無對話。</div>';
  const tech = (m) => (m.detail ? `<details class="tech"><summary>查看技術細節</summary><pre>${esc(m.detail)}</pre></details>` : '');
  return activity.map((m) => {
    if (m.role === 'system') return `<div class="sys-wrap"><div class="sys">${esc(m.time)} · ${esc(m.text)}</div>${tech(m)}</div>`;
    if (m.role === 'user') return `<div class="msg me"><div class="bubble"><div class="hd"><b>你</b> · ${esc(m.time)}</div>${esc(m.text)}</div></div>`;
    const l = look(m.who);
    return `<div class="msg" style="--c:${l.c}"><div class="av">${l.ab}</div><div class="bubble"><div class="hd"><b>${esc(name(m.who))}</b> · ${m.role === 'leader' ? '工頭' : '成員'} · ${esc(m.time)}</div>${esc(m.text)}${tech(m)}</div></div>`;
  }).join('');
}

// Re-render only when the markup changed, so open drop-downs keep their scroll position.
const setHtml = (el, html) => { if (el._html !== html) { el._html = html; el.innerHTML = html; } };
let doneOpen = false;
let histCount = 0; // saved jobs of the open project (for 接著上次的工作) // 這次完成的工作卡 drop-down
const ICON = { DONE:'✅', WORKING:'⏳', WAITING:'🕒', PAUSED:'⏸️', INTERRUPTED:'⏸️', FAILED:'❌', WAITING_EXTERNAL:'🟡', WAITING_AGENT:'🤝', NEEDS_USER:'🔴' };
const STEP_WORD = { DONE:'已完成', WORKING:'工作中', WAITING:'待做', PAUSED:'已暫停', INTERRUPTED:'已中斷', FAILED:'失敗', WAITING_EXTERNAL:'等待外部結果', WAITING_AGENT:'等待其他 AI', NEEDS_USER:'需要 Nana' };
const prShort = (pr) => (/^\d+$/.test(String(pr)) ? '#' + pr : '#' + String(pr).split('/').pop());

// One honest line about what a parked card waits for and what happens next.
function waitLine(t) {
  const wt = t.wait || {};
  if (t.status === 'NEEDS_USER') return `需要 Nana：${t.ask?.question || ''}`;
  if (t.status === 'WAITING_AGENT') return `在等 ${name(wt.agent)}：${wt.what || ''}（它做完會自動交回 ${name(t.agent)}）`;
  if (wt.pr && !wt.manual) return `在等 GitHub CI（PR ${prShort(wt.pr)}）：${wt.ci || '檢查中'}（Studio 每分鐘檢查，跑完自動交回 ${name(t.agent)}）`;
  return `在等「${wt.what || '外部結果'}」：Studio 無法自動確認${wt.error ? '（' + wt.error + '）' : ''}，好了請按「繼續」`;
}

// "你現在需要做什麼" for one project: { ic, cls, text, need }.
const STATE_LOOK = { need:['🔴','bad'], open:['🟡','on'], wait:['🟡','on'], done:['✅','ok'], idle:['⚪',''] };
function attention(w) {
  const r = w.run, ts = w.tasks;
  if (!r?.active && !r?.paused && w.pstate) {
    const ps = w.pstate, [ic, cls] = STATE_LOOK[ps.level] || ['⚪', ''];
    return { ic, cls, need: ps.level === 'need', text: ps.level === 'wait' ? ps.headline + '（不需要操作）' : ps.level === 'need' ? '需要 Nana：' + ps.you : ps.headline, state: ps };
  }
  if (!r) return { ic:'⚪', cls:'', text:'待命：還沒有交辦工作' };
  const askCard = ts.find((t) => t.status === 'NEEDS_USER');
  if (r.active && (askCard || (r.ask && !r.summarizing))) return { ic:'🔴', cls:'bad', need:true, text:'需要 Nana：' + (askCard ? askCard.ask?.question : r.ask.question) };
  const manual = ts.find((t) => t.status === 'WAITING_EXTERNAL' && t.wait?.manual);
  if (r.active && manual) return { ic:'🟠', cls:'bad', need:true, text:`需要你按「繼續」：${name(manual.agent)} 在等「${manual.wait.what}」，Studio 無法自動確認` };
  if (r.paused) return { ic:'🔵', cls:'pz', text:ts.some((t) => t.status === 'INTERRUPTED') ? '已中斷：按「繼續」從中斷的地方接著做' : '已暫停：按「繼續」接著做' };
  if (r.active) {
    if (r.phase === 'planning' || r.summarizing || ts.some((t) => t.status === 'WORKING')) return { ic:'🟢', cls:'ok', text:'不需要操作，團隊正在工作' };
    const waits = ts.filter((t) => PARKED.includes(t.status)).map((t) => (t.status === 'WAITING_AGENT' ? name(t.wait?.agent) : t.wait?.pr ? 'CI' : t.wait?.what || '外部結果'));
    return { ic:'🟡', cls:'on', text:`不需要操作，正在等待 ${[...new Set(waits)].join('、') || '下一步'}` };
  }
  if (r.stopped) return { ic:'⏹️', cls:'', text:'已停止' };
  if (r.result === 'done') return { ic:'✅', cls:'ok', text:'已完成' };
  return { ic:'❌', cls:'bad', need:true, text:'這次沒有完成：看一下結果，或按「↻ 接著上次的工作」' };
}

// KPI "這次完成的工作卡" that opens a list of every card with its full result.

// The Leader's fixed rules, in plain words (what planPrompt / summarize tell it).

• 互不相關的工作會同時派給不同成員；同一個檔案不會讓兩位成員同時改。
• 每張工作卡的說明都要完整，成員只看那張卡就能做。
• 成員只在這個專案資料夾裡工作，做完回報 1～3 句摘要。
• 全部做完後，工頭寫 2～4 句總結給你。`;

        ${[['stop', '① 完成就停（報告後等我）'], ['suggest', '② 完成後建議下一步（等我按）'], ['auto', '③ 自動持續開發（自動做下一個小目標）']].map(([k, t]) => `<option value="${k}" ${(w.afterDone || 'stop') === k ? 'selected' : ''}>${t}</option>`).join('')}
      </select><span class="hint" style="font-size:13px;margin-left:8px">交付：</span>

      <select data-strategy style="width:auto;padding:4px 8px;font-size:13px" title="工頭自己判斷普通卡／困難卡；普通卡失敗會自動改用強模型重試一次">${STRATEGY.map(([k, t]) => `<option value="${k}" ${(w.strategy || 'save') === k ? 'selected' : ''}>${t}</option>`).join('')}</select>${w.afterDone === 'auto' ? `<span class="tag pz">🔁 自動中 ${w.autoRounds || 0}/5</span>` : ''}</div>
    <div class="team-line">${esc(lead.name)} 工頭 · ${crew.length ? esc(crew.join(' + ')) + ' 協作' : '目前沒有可用的成員'} · Product First · 自動派工</div>
    <details class="rules"><summary>查看 AI 工作規則 ▾</summary><div class="rules-b">${r && (running || paused) ? `<b>目前交辦的內容</b>${esc(r.request)}` : ''}<b>工頭的工作方式</b>${esc(RULES)}</div></details>
    ${!running && !paused && ['open', 'wait', 'need'].includes(w.pstate?.level) ? '<div class="hint" style="border-top:1px dashed var(--line);padding-top:10px;font-weight:700">或者，開始新的工作</div>' : ''}
    ${running || paused ? `<div class="ask">工作進行中，想補充或修改指示？</div>
    <textarea id="instruction" placeholder="例如：按鈕改成藍色。或：先不要 merge，等我看過。\n工頭會決定要轉告哪位成員、取消或追加哪些工作卡。">${esc(drafts['i:' + w.project] || '')}</textarea>
    <div class="row"><span class="hint">${paused ? '工作暫停中：指示會先保留，按「繼續」後交給工頭' : r?.notes || r?.noting ? '⏳ 工頭正在看你的指示…' : '正在工作的成員做完手上這一步就會收到'}</span><span class="err" id="err"></span><span class="spacer"></span>
      <label class="hint" style="display:flex;align-items:center;gap:4px;cursor:pointer" title="正在做的成員會馬上停下（手上這一步可能做到一半），等工頭看完指示再接著做"><input type="checkbox" id="interruptChk">⚡ 立刻打斷正在做的成員</label>

    <textarea id="request" placeholder="例如：幫我把「匯出 PDF」功能做好，做完告訴我怎麼試用。\n或：首頁載入太慢，幫我找出原因並修好。">${esc(drafts[w.project] || '')}</textarea>
    <div class="row"><span class="hint">${running ? '團隊正在做上一件事，做完才能交下一件（可以先打好）。' : 'Ctrl + Enter 也可以送出'}</span><span class="err" id="err"></span><span class="spacer"></span>
      <button class="btn primary" id="start" ${running ? 'disabled' : ''} title="交辦一件新的工作">▶ 交給團隊</button></div>`;

// 現在發生什麼: status, progress, what we wait for, what happens next, and what the user must do (if anything).
// Project State card: last goal, done, current (verified with Git / GitHub), next, and what Nana does.
function stateCardHtml(w, att) {
  const ps = w.pstate;
  if (!ps) return `<div class="wf-head"><span class="big">⏳</span><div><div class="st-line">${esc(w.name)}</div><div class="sub" style="margin:0">正在讀取專案狀態（Git／GitHub）…</div></div></div>`;
  const g = ps.git || {};
  const pending = ['open', 'wait', 'need'].includes(ps.level);
  const src = g.error ? `只根據上次的工作紀錄（${g.error}）` : `Git／GitHub 已核對 · ${when(g.checkedAt)}${g.mainSha ? ' · main ' + g.mainSha : ''}${g.branch ? ' · 本機 ' + g.branch : ''}`;
  const list = (xs, mark) => (xs.length ? xs.map((x) => `${mark} ${esc(x)}`).join('\n') : '—');
  return `${pending ? '<div class="hint" style="font-weight:700;margin-bottom:6px">繼續上一件事</div>' : ''}
    <div class="wf-head"><span class="big">${att.ic}</span><div><div class="st-line">${esc(w.name)}</div><div class="att ${att.cls}" style="display:inline-block;margin-top:4px">${esc(ps.headline)}</div></div></div>
    <div class="row hint" style="margin:-4px 0 10px">${esc(src)}<button class="btn small ghost" data-refresh-state>↻ 重新整理狀態</button></div>
    <dl class="wf">
      ${ps.goal ? `<dt>上次目標</dt><dd>${esc(ps.goal)}</dd>` : ''}
      ${ps.level !== 'idle' ? `<dt>已完成</dt><dd>${list(ps.done, '✓')}</dd><dt>目前</dt><dd>${list(ps.current, '⏳')}</dd>` : ''}
      ${ps.next ? `<dt>接下來</dt><dd>${esc(ps.next)}</dd>` : ''}
      <dt>你現在</dt><dd>${esc(ps.you)}</dd>
    </dl>
    ${ps.suggestions?.length ? `<div class="askbox" style="border-color:var(--accent)"><div class="q">工頭建議的下一步</div>${ps.suggestions.map((x, i) => `<div class="row" style="align-items:flex-start;flex-wrap:nowrap"><div style="flex:1"><b>${i + 1}. ${esc(x.title)}</b>${x.why ? `<div class="hint">${esc(x.why)}</div>` : ''}</div><button class="btn small primary" data-suggest="${i}">▶ 做這個</button></div>`).join('')}</div>` : ''}
    ${pending ? '<div class="row"><button class="btn primary" data-continue-state title="Studio 先重新核對 Git／GitHub，再把專案接力棒交給工頭">▶ 接著處理</button></div>' : ''}`;
}

function nowHtml(w, att) {
  const r = w.run, ts = w.tasks;
  if (!r?.active && !r?.paused) return stateCardHtml(w, att);
  if (!r) return `<div class="wf-head"><span class="big">⚪</span><div><div class="st-line">待命</div><div class="sub" style="margin:0">在下面說你要什麼，按「交給團隊」就開始${histCount ? '；或按「↻ 接著上次的工作」接著上次做' : ''}。</div></div></div>`;
  const done = ts.filter((t) => t.status === 'DONE');
  const lastDone = done.at(-1);
  const pr = ts.map((t) => String(t.result).match(/https:\/\/github\.com\/[\w.-]+\/[\w.-]+\/pull\/\d+|\bPR\s*#\d+/i)?.[0] || (t.wait?.pr ? 'PR ' + prShort(t.wait.pr) : '')).filter(Boolean).at(-1);
  const progress = r.phase === 'planning' ? `工頭 ${name(r.leader)} 正在看需求、拆工作`
    : !ts.length ? '工頭這次沒有建立工作卡（詳細原因在下面的完整對話紀錄）'
    : `完成 ${done.length}/${ts.length} 張工作卡${lastDone ? `，最近完成「${lastDone.title}」` : ''}${pr ? `\n已知交付：${/^PR/i.test(pr) ? pr : 'PR ' + prShort(pr)}` : ''}`;
  const byId = (id) => ts.find((x) => x.id === id);
  const blocked = ts.filter((t) => t.status === 'WAITING' && (t.after || []).some((id) => byId(id)?.status !== 'DONE'));
  const waits = [...ts.filter((t) => PARKED.includes(t.status)).map((t) => '• ' + waitLine(t)),
    ...blocked.map((t) => `• 「${t.title}」等「${(t.after || []).map((id) => byId(id)?.title).filter(Boolean).join('」「')}」完成`)];
  if (r.ask && !r.summarizing) waits.unshift('• Nana 的決定：' + r.ask.question);
  if (r.notes || r.noting) waits.unshift('• 工頭正在看你的新指示');
  const working = ts.filter((t) => t.status === 'WORKING');
  const ready = ts.find((t) => t.status === 'WAITING' && !blocked.includes(t));
  const next = r.paused ? '按「繼續」後，從停下的地方接著做'
    : !r.active ? (r.result === 'done' ? '沒有了，這次的工作完成了' : '可以按「↻ 接著上次的工作」，工頭會從這裡接著做')
    : r.phase === 'planning' ? '工頭拆完工作後，成員會自動開始'
    : r.ask && !r.summarizing ? '你回覆後，工頭會接著安排'
    : r.summarizing ? '工頭確認整體是否完成；還沒完成會自己追加工作卡'
    : [...working.map((t) => `${name(t.agent)} 做完「${t.title}」${ready ? ` → ${name(ready.agent)} 接著做「${ready.title}」` : ''}`),
      ...ts.filter((t) => PARKED.includes(t.status) && t.status !== 'NEEDS_USER' && !(t.status === 'WAITING_EXTERNAL' && t.wait?.manual))
        .map((t) => `${t.status === 'WAITING_AGENT' ? name(t.wait?.agent) + ' 做完' : 'CI 跑完'} → ${name(t.agent)} 自動繼續「${t.title}」`)].join('\n')
      || '全部工作卡結束後，工頭會確認整體是否完成';
  const askCard = r.active && ts.find((t) => t.status === 'NEEDS_USER');
  const leadAsk = r.active && !askCard && r.ask && !r.summarizing ? r.ask : null;
  const ask = askCard ? { q: askCard.ask?.question, opts: askCard.ask?.options || [], id: askCard.id, who: name(askCard.agent) } : leadAsk ? { q: leadAsk.question, opts: leadAsk.options || [], id: '', who: '工頭 ' + name(r.leader) } : null;
  const manual = r.active ? ts.filter((t) => t.status === 'WAITING_EXTERNAL' && t.wait?.manual) : [];
  let you = '☕ 不需要操作';
  if (ask) you = `<div class="askbox"><div class="q">${esc(ask.who)} 問你：${esc(ask.q)}</div>
      ${ask.opts.length ? `<div class="row">${ask.opts.map((o) => `<button class="btn" data-answer="${esc(o)}" data-for="${ask.id}">${esc(o)}</button>`).join('')}</div>` : ''}
      <textarea id="answerText" placeholder="${ask.opts.length ? '或直接打字回覆…' : '在這裡回覆…'}"></textarea>
      <div class="row"><span class="spacer"></span><button class="btn primary" data-answer-send data-for="${ask.id}">送出回覆</button></div></div>`;
  else if (manual.length) you = manual.map((t) => `<div class="row" style="margin-bottom:6px">「${esc(t.wait.what)}」好了嗎？<button class="btn small pz" data-continue-card="${t.id}">好了，繼續</button></div>`).join('');
  else if (r.paused) you = '<button class="btn pz small" data-resume-job>▶ 繼續</button>';
  else if (!r.active && r.result !== 'done' && !r.stopped) you = '看一下下面的結果，或按「↻ 接著上次的工作」';
  else if (!r.active) you = '☕ 不需要操作';
  const step = (ic, title, desc, cur) => `<div class="step ${cur ? 'cur' : ''}"><div class="ic">${ic}</div><div><div class="st">${title}</div>${desc ? `<div class="sd">${esc(desc)}</div>` : ''}</div></div>`;
  const firstLine = String(r.request).split('\n').find((x) => x.trim()) || '';
  const planned = ts.length > 0;
  const report = r.phase === 'finished' ? [...w.activity].reverse().find((m) => m.role === 'leader')?.text : '';
  return `<div class="wf-head"><span class="big">${att.ic}</span><div><div class="st-line">${esc(w.name)}</div><div class="att ${att.cls}" style="display:inline-block;margin-top:4px">${esc(att.text)}</div></div></div>
    <dl class="wf">
      <dt>目前進度</dt><dd>${esc(progress)}</dd>
      <dt>正在等待</dt><dd>${waits.length ? esc(waits.join('\n')) : '—'}</dd>
      <dt>接下來</dt><dd>${esc(next)}</dd>
      <dt>你現在</dt><dd>${you}</dd>
    </dl>
    <details class="rules" ${r.active || r.paused ? 'open' : ''}><summary>每張工作卡的進度 ▾</summary><div class="steps" style="margin-top:6px">
      ${step('📝', r.continues ? '你要團隊接著上次的工作' : '你交辦了工作', firstLine.slice(0, 140))}
      ${step(planned ? '✅' : r.active ? '⏳' : '🕒', planned ? `工頭 ${esc(name(r.leader))} 拆成 ${ts.length} 張工作卡` : `工頭 ${esc(name(r.leader))} 拆工作中`, '', !planned && r.active)}
      ${ts.map((t) => step(ICON[t.status] || '•', `${esc(t.title)}${t.escalated ? '（已自動升級強模型）' : t.hard ? '（困難）' : ''} · ${esc(name(t.agent))} · ${STEP_WORD[t.status] || t.status}`,
        PARKED.includes(t.status) ? waitLine(t) : t.status === 'WORKING' ? '正在做…' : t.status === 'WAITING' ? (t.blockReason ? '先不動：' + t.blockReason : blocked.includes(t) ? '等前一張卡完成' : t.writes !== false && ts.some((x) => x !== t && x.writes !== false && ['WORKING', 'WAITING_EXTERNAL', 'NEEDS_USER'].includes(x.status)) ? '另一張卡正在修改這個專案（同一時間只有一位能改檔案），輪到它才開始' : '等成員有空就開始') : t.result, t.status === 'WORKING')).join('')}
      ${planned ? step(report ? '✅' : r.summarizing ? '⏳' : '🕒', '工頭確認整體完成', report || '', r.summarizing) : ''}
    </div></details>`;
}

const kpi = (v, l) => `<div class="kpi"><div class="v">${v}</div><div class="l">${l}</div></div>`;
const dotOf = (k) => (k ? `<span class="dot ${k}"></span>` : '<span class="dot"></span>');

function projCardHtml(w) {
  const r = w.run, [, label, pill] = wsStatus(w), n = (st) => w.tasks.filter((t) => t.status === st).length;

  const seg = (v, c) => (total && v ? `<i style="width:${(v / total) * 100}%;background:var(--${c})"></i>` : '');
  return `<a class="pcard" href="#p=${encodeURIComponent(w.project)}" style="--c:${look(w.leader).c}">
    <div class="pc-top"><span class="nm">${esc(w.name)}</span>${r?.active || r?.paused || !w.pstate ? `<span class="pill ${pill}">${label}</span>` : ''}
      ${r?.active || r?.paused ? `<button class="btn small ${r.paused ? 'pz' : ''}" data-pz="${esc(w.project)}">${r.paused ? '繼續' : '暫停'}</button>` : ''}</div>
    <div class="sub" style="margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(w.project)}">${esc(w.project)}</div>
    <div class="att ${attention(w).cls}">${attention(w).ic} ${esc(attention(w).text)}</div>
    ${w.afterDone === 'auto' ? `<div class="lim-f"><span class="tag pz">🔁 自動持續開發 ${w.autoRounds || 0}/5</span></div>` : w.afterDone === 'suggest' && !w.run?.active && w.pstate?.suggestions?.length ? `<div class="lim-f"><b>建議</b> ${esc(w.pstate.suggestions.map((x) => x.title).join('、'))}</div>` : ''}
    ${attention(w).state && attention(w).state.level !== 'idle' ? `<div class="lim-f"><b>下一步</b> ${esc(attention(w).state.next)}</div><div class="lim-f"><b>Nana</b> ${esc(attention(w).state.you)}</div>` : ''}
    <div class="pc-req">${r?.active || r?.paused ? esc(r.request) : w.pstate?.goal ? '上次目標：' + esc(w.pstate.goal) : r ? esc(r.request) : '<span class="empty">還沒有工作，點進來交給團隊。</span>'}</div>
    ${total ? `<div class="sbar">${seg(done, 'ok')}${seg(working, 'work')}${seg(failed, 'bad')}</div>
      <div class="lim-f">完成 ${done}/${total}${working ? ` · 進行中 ${working}` : ''}${failed ? ` · 失敗 ${failed}` : ''}</div>` : ''}
    <div class="lim-f">工頭 <span class="who" style="--c:${look(w.leader).c}"><i></i>${esc(name(w.leader))}</span></div>
    ${w.tasks.filter((t) => t.status === 'WORKING').map((t) => `<div class="who" style="--c:${look(t.agent).c}"><i></i>${esc(name(t.agent))}：${esc(t.title)}</div>`).join('')}
  </a>`;
}

// Agents × projects: who is doing what right now.
function matrixHtml() {
  if (!S.workspaces.length) return '<div class="empty">開啟專案後，這裡會顯示每位員工在每個專案正在做什麼。</div>';
  const head = `<tr><th>員工</th>${S.workspaces.map((w) => `<th><a href="#p=${encodeURIComponent(w.project)}" style="color:inherit">${esc(w.name)}</a></th>`).join('')}</tr>`;
  const rows = S.agents.map((a) => `<tr><td><span class="who" style="--c:${look(a.id).c}"><i></i>${esc(a.name)}</span></td>${S.workspaces.map((w) => {
    const d = duty(a, w);
    return d.kind || d.text ? `<td class="${d.kind ? '' : 'idle'}">${d.kind ? dotOf(d.kind === 'wait' ? '' : d.kind) + ' ' : ''}${esc(d.text)}</td>` : '<td class="idle">—</td>';
  }).join('')}</tr>`).join('');
  return `<table class="matrix">${head}${rows}</table>`;
}

function renderTabs(w) {
  $('tabs').innerHTML = `<a class="tab ${w ? '' : 'on'}" href="#">總覽</a>` + S.workspaces.map((x) => {
    const [k] = wsStatus(x), att = attention(x), n = x.tasks.filter((t) => t.status === 'WORKING').length;
    return `<a class="tab ${x === w ? 'on' : ''}" href="#p=${encodeURIComponent(x.project)}" title="${esc(x.project)} · ${esc(att.text)}">${dotOf(att.need ? 'bad' : k)}<span class="nm">${esc(x.name)}</span>${n ? `<span class="n">${n}</span>` : ''}</a>`;
  }).join('') + '<button class="tab add" id="tabAdd" title="開啟另一個專案（瀏覽資料夾）">＋</button>';
}

function renderOverview() {
  const all = S.workspaces.flatMap((w) => w.tasks);
  const avail = S.agents.filter((a) => a.status === 'available').length;
  $('ovKpis').innerHTML = kpi(S.todayDone, '今日完成的工作卡') + kpi(`${S.workspaces.filter((w) => w.run?.active).length}/${S.workspaces.length}`, '工作中的專案') +
    kpi(all.filter((t) => t.status === 'WORKING').length, '進行中的工作卡') + kpi(`${avail}/${S.agents.length}`, '可用的 AI 員工');
  $('projects').innerHTML = S.workspaces.length ? S.workspaces.map(projCardHtml).join('')
    : '<div class="panel empty">還沒有開啟專案。用左邊「開啟專案」或上方 ＋ 開啟一個或多個資料夾，每個專案會有自己的分頁，可以同時工作。</div>';
  $('matrix').innerHTML = matrixHtml();
  if (!$('ovSeats').contains(document.activeElement)) $('ovSeats').innerHTML = S.agents.map((a) => seatHtml(a, null)).join('');
}

function renderProject(w, force) {
  if (force) histCount = 0;
  const r = w.run, running = !!r?.active, paused = !!r?.paused;
  $('pvHead').style.setProperty('--c', look(w.leader).c);
  $('pvName').textContent = w.name;
  $('pvPath').textContent = $('pvPath').title = w.project;
  $('paseoOpen').hidden = S.paseo === 'missing';
  if (!$('paseoOpen').dataset.busy) $('paseoOpen').disabled = false;
  // Without a live job the pill shows the project state, not a bare 待命.
  $('runPill').textContent = running ? `團隊工作中 · 工頭 ${name(r.leader)}` : paused ? '已暫停 · 可稍後繼續' : w.pstate ? w.pstate.headline : (r?.stopped ? '已停止' : '待命');
  $('runPill').className = 'pill ' + (running ? 'on' : paused ? 'pz' : w.pstate ? { need:'bad', open:'on', wait:'on', done:'ok' }[w.pstate.level] || '' : '');
  $('pauseResume').textContent = paused ? '繼續' : '暫停';
  $('pauseResume').disabled = !running && !paused;
  $('stop').disabled = !running && !paused;
  $('closeWs').disabled = running;

  const avail = S.agents.filter((a) => a.status === 'available').length;
  const n = (st) => w.tasks.filter((t) => t.status === st).length;
  $('kpis').hidden = !(running || paused);
  if (force && !running && (!w.pstate || Date.now() - new Date(w.pstate.updatedAt) > 120000)) post('/api/project-state/refresh', { ws: w.project }).catch(() => {});
  setHtml($('kpis'), doneDropHtml(w) + kpi(n('WORKING'), '進行中') +
    kpi(n('WAITING') + n('PAUSED'), paused ? '等待／已暫停' : '等待中') + kpi(`${avail}/${S.agents.length}`, '可用的 AI 員工'));

  if (force || !$('office').contains(document.activeElement)) {
    $('office').style.setProperty('--c', look(w.leader).c);
    setHtml($('office'), officeHtml(w));
  }
  if (force || !$('nowPanel').contains(document.activeElement)) { const att = attention(w); $('nowPanel').classList.toggle('need', !!att.need); setHtml($('nowPanel'), nowHtml(w, att)); }
  // The 工頭 card comes first so its model, limits and settings stay one click away.
  if (force || !$('seats').contains(document.activeElement)) setHtml($('seats'), [w.leader, ...S.agents.map((a) => a.id).filter((id) => id !== w.leader)].map((id) => seatHtml(S.agents.find((a) => a.id === id), w)).join(''));
  if (force || !$('board').contains(document.activeElement)) $('board').innerHTML = boardHtml(w.tasks, S.agents, true);

  const box = $('chat');
  const atBottom = force || box.scrollTop + box.clientHeight >= box.scrollHeight - 30;
  box.innerHTML = chatHtml(w.activity);
  if (atBottom) box.scrollTop = box.scrollHeight;

  $('progressBox').hidden = !w.progress?.exists;
  $('progressBox').parentElement.style.gridTemplateColumns = w.progress?.exists ? '' : '1fr';
  $('progressTitle').title = w.progress?.file || '';
  $('progress').textContent = w.progress?.text || '';
}

function render() {
  const w = W(), view = w ? w.project : '', force = view !== shownView;
  shownView = view;
  renderTabs(w);
  $('overview').hidden = !!w;
  $('projectView').hidden = !w;
  if (w) renderProject(w, force); else renderOverview();
  document.title = (w ? w.name + ' · ' : '') + 'Multi-Agent Studio';

  const pz = { running:['Paseo 執行中','ok'], stopped:['Paseo 未開啟',''], missing:['Paseo 未安裝',''], checking:['Paseo 檢查中…',''] }[S.paseo] || ['Paseo',''];
  $('paseoPill').textContent = pz[0];
  $('paseoPill').className = 'pill ' + pz[1];

  const open = (p) => S.workspaces.some((x) => sameP(x.project, p));
  $('recent').innerHTML = S.recent.length ? S.recent.map((p) => `
    <div class="chip ${open(p) ? 'on' : ''}" data-project="${esc(p)}" title="${esc(p)}${open(p) ? '（已開啟）' : ''}"><span class="nm">${esc(base(p))}</span><span class="x" data-remove="${esc(p)}" title="從清單移除">✕</span></div>`).join('')
    : '<div class="empty">用過的專案會出現在這裡。</div>';

  if (S.historyRev + '|' + view !== histKey) { histKey = S.historyRev + '|' + view; loadHistory(view); }
  renderNotifyBtn();
}

// On a project page the list shows only that project's runs.
async function loadHistory(view) {
  const list = (await (await fetch('/api/history')).json()).filter((h) => !view || sameP(h.project, view));
  if (view && histCount !== list.length) { histCount = list.length; if ($('office')) $('office')._html = ''; render(); }
  $('histHead').textContent = view ? `歷史紀錄 · ${W()?.name || base(view)}` : '歷史紀錄（全部專案）';
  $('history').innerHTML = list.length ? list.map((h) => `
    <button class="hitem" data-hist="${h.id}">
      <div class="req">${esc(h.request)}</div>
      <div class="meta"><span>${fmt(h.startedAt)}</span><span>${esc(base(h.project))}</span>${h.status === 'paused' || h.status === 'interrupted' ? `<span class="tag pz">${STATUS[h.status]}</span>` : `<span>${STATUS[h.status] || h.status} ${h.done}/${h.total}</span>`}</div>
    </button>`).join('') : '<div class="empty">完成的工作會保存在這裡。</div>';
}

async function openHistory(id) {
  const r = await (await fetch('/api/history/' + id)).json();
  histOpenId = id;
  histOpenProject = r.project;
  $('histTitle').textContent = fmt(r.startedAt) + ' 的工作紀錄';
  $('histMeta').innerHTML = `<div><b>需求：</b>${esc(r.request)}</div>
    <div class="sub" style="margin:6px 0 0">專案 ${esc(r.project)} · 工頭 ${esc(name(r.leader))} · ${STATUS[r.status] || r.status}</div>`;
  $('histBoard').innerHTML = boardHtml(r.tasks, S.agents, false);
  $('histChat').innerHTML = chatHtml(r.activity);
  const ow = S.workspaces.find((x) => sameP(x.project, r.project));
  $('histResume').hidden = !((r.status === 'paused' || r.status === 'running') && !ow?.run?.active && !ow?.run?.paused);
  $('histDlg').showModal();
}
async function refresh() {
  try {
    const res = await fetch('/api/state');
    const txt = await res.text();
    if (txt === last && Date.now() - lastRender < 30000) return; // re-render now and then so reset bars move
    last = txt; S = JSON.parse(txt); render(); lastRender = Date.now();
    handleNotices();
  } catch { $('paseoPill').textContent = '無法連到 Studio（視窗是否已關閉？）'; }
}

// ---------- Notifications: the server sends the Windows toast; open pages add a sound ----------
let seenNotice = null, lastRender = 0, audio = null;
document.addEventListener('pointerdown', () => { audio ??= new AudioContext(); }); // browsers only allow sound after a click

function handleNotices() {
  if (seenNotice === null) { seenNotice = S.noticeSeq; return; } // don't replay old notices on page load
  for (const n of S.notices) if (n.id > seenNotice && S.notify) announce(n);
  seenNotice = S.noticeSeq;
}

const announce = (n) => chime(n.kind === 'done');

function chime(ok) {
  try {
    const ac = audio ?? (audio = new AudioContext());
    (ok ? [660, 880] : [440, 330]).forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i * 0.18;
      o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
      o.connect(g).connect(ac.destination);
      o.start(t); o.stop(t + 0.32);
    });
  } catch { /* no audio device */ }
}

function renderNotifyBtn() {
  $('notifyBtn').textContent = S.notify ? '🔔 Windows 通知：開' : '🔕 Windows 通知：關';
}

$('notifyBtn').onclick = async () => {
  const on = !S.notify;
  await post('/api/notify', { on });
  if (on) { chime(true); post('/api/notify/test'); } // shows a test toast right away
};

const ws = () => W()?.project;
const openProject = (p) => post('/api/workspace/open', { path: p }).then((j) => go(j.project));
const browse = () => post('/api/browse').then((j) => { if (j.project) go(j.project); });
$('browse').onclick = browse;
$('setProject').onclick = () => openProject($('project').value).then(() => { $('project').value = ''; });
$('stop').onclick = () => confirm('停止這件工作？\n\n• 成員馬上停下，未完成的工作卡標成失敗\n• 這件工作不能再按「繼續」，之後要用「▶ 接著處理」開新的一輪\n\n只是想晚點再做、保留進度，請按「暫停」。') && post('/api/stop', { ws: ws() });
$('pauseResume').onclick = () => post(W()?.run?.paused ? '/api/resume' : '/api/pause', { ws: ws() });
$('renameWs').onclick = () => { const n = prompt('這個專案的顯示名稱（留空 = 用資料夾名稱）', W()?.name || ''); if (n !== null) post('/api/workspace/rename', { ws: ws(), name: n }); };
$('closeWs').onclick = () => post('/api/workspace/close', { ws: ws() }).then(() => go(''));
$('histClose').onclick = () => $('histDlg').close();
$('histResume').onclick = () => post('/api/resume', { id: histOpenId }).then(() => { $('histDlg').close(); go(histOpenProject); });
$('paseoOpen').onclick = async () => {
  const b = $('paseoOpen');
  b.dataset.busy = '1'; b.disabled = true; b.textContent = '開啟中…';
  try { await post('/api/paseo/open', { ws: ws() }); } catch {} finally { delete b.dataset.busy; b.disabled = false; b.textContent = '用 Paseo 開啟'; }
};
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' || !e.ctrlKey) return;
  if (e.target.id === 'request' && !$('start').disabled) $('start').click();
  if (e.target.id === 'instruction') $('instructBtn').click();
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'request' && ws()) drafts[ws()] = e.target.value;
  if (e.target.id === 'instruction' && ws()) drafts['i:' + ws()] = e.target.value;
});
document.addEventListener('toggle', (e) => { if (e.target.id === 'doneDrop') doneOpen = e.target.open; }, true);
document.addEventListener('change', (e) => {
  const dl = e.target.closest('select[data-delivery]');
  if (dl) return post('/api/delivery', { ws: ws(), mode: dl.value }).catch(() => {});
  const sg = e.target.closest('select[data-strategy]');
  if (sg) return post('/api/strategy', { ws: ws(), strategy: sg.value }).catch(() => {});
  const ad = e.target.closest('select[data-after-done]');
  if (ad) {
    const mode = ad.value;
    if (mode === 'auto' && !confirm('開啟「自動持續開發」？\n\n每次工作完成後，工頭會自己選下一個小目標並自動派工，不會等你按。\n• 最多連續自動做 5 件，之後停下等你\n• 需要你決定的事、失敗、暫停或 Stop 都會讓它停下\n• 隨時可以改回「完成就停」')) { ad.value = W()?.afterDone || 'stop'; return; }
    return post('/api/after-done', { ws: ws(), mode }).catch(() => {});
  }
  const sw = e.target.closest('select[data-swap-leader]');
  if (sw) {
    const id = sw.value, busy = W()?.run?.active || W()?.run?.paused;
    sw.value = '';
    if (id && (!busy || confirm(`把工頭交接給 ${name(id)}？\n新工頭會接手原本的需求和目前的工作卡，不用重新輸入；正在工作的成員會繼續做。`))) post('/api/leader', { ws: ws(), agent: id }).catch(() => {});
    return;
  }
  const s = e.target.closest('select[data-cfg]');
  if (!s) return;
  const id = s.dataset.cfg, p = ws(), pick = (k) => s.closest('.cfg').querySelector(`select[data-k="${k}"]`).value;
  s.blur();
  post('/api/agent-config', { ws: p, agent: id, model: pick('model'), effort: pick('effort'), hardModel: pick('hardModel'), hardEffort: pick('hardEffort') }).catch(() => {});
});
document.addEventListener('click', (e) => {
  if (doneOpen && !e.target.closest('#doneDrop')) { doneOpen = false; $('doneDrop')?.removeAttribute('open'); }
  const pzb = e.target.closest('[data-pz]');
  if (pzb) { // inside a project card link: act, don't open the tab
    e.preventDefault();
    const x = S.workspaces.find((y) => y.project === pzb.dataset.pz);
    return post(x?.run?.paused ? '/api/resume' : '/api/pause', { ws: pzb.dataset.pz }).catch(() => {});
  }
  const rm = e.target.closest('[data-remove]');
  if (rm) { e.stopPropagation(); return post('/api/recent/remove', { path: rm.dataset.remove }); }
  const chip = e.target.closest('[data-project]');
  if (chip) return openProject(chip.dataset.project).catch(() => {});
  const h = e.target.closest('[data-hist]');
  if (h) return openHistory(h.dataset.hist);
  if (e.target.closest('[data-limits-refresh]')) { e.preventDefault(); return post('/api/limits/refresh'); }
  const b = e.target.closest('button');
  if (!b) return;
  if (b.id === 'tabAdd') return browse();
  if (b.dataset.suggest !== undefined) {
    const x = W()?.pstate?.suggestions?.[+b.dataset.suggest];
    if (x) { b.disabled = true; return post('/api/start', { ws: ws(), request: x.request, continue: true }).catch(() => {}); }
  }
  if (b.id === 'instructBtn') {
    const p = ws();
    return post('/api/instruct', { ws: p, text: $('instruction').value, interrupt: !!$('interruptChk')?.checked }).then(() => { drafts['i:' + p] = ''; $('office')._html = ''; render(); }).catch(() => {});
  }
  if (b.hasAttribute('data-continue-state') || b.hasAttribute('data-refresh-state')) {
    b.disabled = true; b.textContent = b.hasAttribute('data-refresh-state') ? '讀取中…' : '核對狀態中…';
    return post(b.hasAttribute('data-refresh-state') ? '/api/project-state/refresh' : '/api/continue', { ws: ws() }).catch(() => {});
  }
  if (b.hasAttribute('data-resume-job')) return post('/api/resume', { ws: ws() }).catch(() => {});
  if (b.dataset.continueCard) return post('/api/continue-card', { ws: ws(), taskId: b.dataset.continueCard }).catch(() => {});
  if (b.dataset.answer !== undefined || b.hasAttribute('data-answer-send')) {
    const text = b.dataset.answer ?? $('answerText')?.value ?? '';
    return post('/api/answer', { ws: ws(), taskId: b.dataset.for || '', text }).catch(() => {});
  }
  if (b.id === 'start') {
    const p = ws();
    return post('/api/start', { ws: p, request: $('request').value }).then(() => { drafts[p] = ''; $('request').value = ''; b.blur(); }).catch(() => {});
  }
  if (b.hasAttribute('data-recheck')) return post('/api/check');
  b.blur();
  if (b.hasAttribute('data-codex-login')) post('/api/codex-login');
  if (b.dataset.leader) {
    const busy = W()?.run?.active || W()?.run?.paused;
    if (!busy || confirm(`把工頭交接給 ${name(b.dataset.leader)}？\n新工頭會接手原本的需求和目前的工作卡，不用重新輸入；正在工作的成員會繼續做。`)) post('/api/leader', { ws: ws(), agent: b.dataset.leader });
  }
  if (b.dataset.worker) post('/api/workers', { ws: ws(), agent: b.dataset.worker, on: b.dataset.on === '1' });
  if (b.dataset.reassign) post('/api/reassign', { ws: ws(), taskId: b.dataset.reassign, agent: document.querySelector(`select[data-task="${b.dataset.reassign}"]`).value });
});
// 字體大小: scales everything below the top bar; remembered per browser.
(function () {
  const sel = $('fontSize'), lay = document.querySelector('.layout');
  const apply = (v) => { lay.style.zoom = v; sel.value = v; };
  let saved = '1';
  try { saved = localStorage.getItem('studio.fontScale') || '1'; } catch { /* storage blocked: stay at 標準 */ }
  apply([...sel.options].some((o) => o.value === saved) ? saved : '1');
  sel.onchange = () => { apply(sel.value); try { localStorage.setItem('studio.fontScale', sel.value); } catch { /* not remembered */ } };
})();
refresh();
setInterval(refresh, 1000);
</script>
