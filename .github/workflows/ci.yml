name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  studio:
    name: Studio CI (Auto)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: scripts/ci.ps1 -Mode Auto
        shell: pwsh
        run: .\scripts\ci.ps1 -Mode Auto
