name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  studio:
    name: Studio CI (Auto)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: scripts/ci.ps1 -Mode Auto
        shell: pwsh
        run: .\scripts\ci.ps1 -Mode Auto

  aion-contract:
    name: AionCore contract (no models)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the pinned backend and ACP contract
        run: node studio/test-aion-contract.mjs
      - name: Verify external budgeting with a local simulated provider
        run: node studio/test-external-budget-contract.mjs

  w1-managed-spawn:
    name: W1 managed-spawn partial fix (no models)
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - name: Prove old failure and patched native behavior
        shell: pwsh
        run: .\scripts\test-w1-managed-spawn.ps1 -EvidenceDir "${{ runner.temp }}\w1-evidence"
      - name: Preserve native results and explicit W1 limitations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w1-managed-spawn-evidence
          path: ${{ runner.temp }}/w1-evidence
          if-no-files-found: error

  office-preview:
    name: Office static visual preview (no models)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate actual office markup
        run: node scripts/office-preview.cjs
      - name: Install pinned browser renderer
        run: |
          npx --yes playwright@1.56.1 install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Render light, dark and narrow office previews
        run: |
          npx --yes playwright@1.56.1 screenshot --browser chromium --viewport-size '390,720' --color-scheme light --wait-for-timeout 300 file://$PWD/outputs/office-preview.html outputs/office-light.png
          npx --yes playwright@1.56.1 screenshot --browser chromium --viewport-size '390,720' --color-scheme dark --wait-for-timeout 300 file://$PWD/outputs/office-preview.html outputs/office-dark.png
          npx --yes playwright@1.56.1 screenshot --browser chromium --viewport-size '320,720' --color-scheme light --wait-for-timeout 300 file://$PWD/outputs/office-preview.html outputs/office-narrow.png
      - uses: actions/upload-artifact@v4
        with:
          name: office-visual-preview
          path: outputs/office-*.png
          if-no-files-found: error
